<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Python Sandbox with File Menu</title>
  <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/mode/python/python.min.js"></script>
  <style>
    body { font-family: Arial; margin: 0; display: flex; height: 100vh; }
    #sidebar { width: 200px; background: #2c3e50; color: white; padding: 10px; overflow-y: auto; }
    #sidebar h3 { margin-top: 0; }
    #sidebar button { width: 100%; margin-top: 10px; }
    #editor { flex-grow: 1; display: flex; flex-direction: column; }
    #editor-area { flex-grow: 1; }
    #output { background: black; color: lime; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; }
    .file { cursor: pointer; padding: 5px; margin: 2px 0; background: #34495e; }
    .file.active { background: #1abc9c; }
  </style>
</head>
<body onload="brython()">

<div id="sidebar">
  <h3>Files</h3>
  <div id="file-list"></div>
  <button onclick="addNewFile()">+ Add New File</button>
</div>

<div id="editor">
  <div id="editor-area"></div>
  <button onclick="runCode()">Run</button>
  <pre id="output"></pre>
</div>

<script type="text/python">
from browser import document, window, html, stdout

files = { "main.py": "print('Hello from main.py')" }
current_file = "main.py"

class Output:
    def write(self, data):
        document["output"].text += str(data)
    def flush(self): pass

stdout.set_output(Output())

def render_file_list():
    file_list = document["file-list"]
    file_list.clear()
    for fname in files:
        file_div = html.DIV(fname, Class="file")
        if fname == current_file:
            file_div.classList.add("active")
        file_div.bind("click", lambda ev, name=fname: load_file(name))
        file_list <= file_div

def load_file(name):
    global current_file
    files[current_file] = window.editor.getValue()
    current_file = name
    window.editor.setValue(files[name])
    render_file_list()

def addNewFile():
    global current_file
    fname = window.prompt("Enter new file name:", "newfile.py")
    if fname and fname not in files:
        files[fname] = "# New Python file"
        current_file = fname
        window.editor.setValue(files[fname])
        render_file_list()

def runCode():
    document["output"].text = ""
    code = window.editor.getValue()
    exec(code)

render_file_list()
</script>

<script>
let editor = CodeMirror(document.getElementById('editor-area'), {
  mode: 'python',
  lineNumbers: true,
  value: "print('Hello from main.py')"
});
window.editor = editor;
</script>

</body>
</html>
